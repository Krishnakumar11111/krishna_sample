<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | EduTrust LMS Super Admin</title>
        <script>
        (function() {
            var origWarn = console.warn;
            console.warn = function() {
                if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('cdn.tailwindcss.com') !== -1) {
                    return;
                }
                origWarn.apply(console, arguments);
            };
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow-x: hidden; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        .admin-portal-card {
            background-color: #E4F1FF;
            border: 1px solid #B7D7F5;
            box-shadow: 0 16px 36px -12px rgba(37, 99, 235, 0.12), 0 0 0 1px rgba(183, 215, 245, 0.65);
        }
        .portal-input {
            background-color: #FFFFFF;
            border: 1px solid #CBD5E1;
            color: #102A43;
            transition: all 0.2s ease;
        }
        .portal-input:focus {
            background-color: #FFFFFF;
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            outline: none;
        }
        .btn-portal-primary {
            width: 170px;
            height: 42px;
            background-color: #2563EB;
            color: #FFFFFF;
            font-weight: 700;
            font-size: 0.8125rem;
            border-radius: 0.75rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.22);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
        }
        .btn-portal-primary:hover { background-color: #1D4ED8; transform: translateY(-1px); }
    </style>
</head>
<body class="h-screen w-screen text-slate-800 antialiased flex flex-col justify-between relative selection:bg-blue-600 selection:text-white overflow-hidden">

    <!-- Background Layer (No dots) -->
    <div class="fixed inset-0 z-0 bg-white pointer-events-none">
        <div class="absolute inset-0 bg-gradient-to-br from-sky-50/70 via-white to-blue-50/50"></div>
    </div>

    <!-- Curved Shapes -->
    <div class="fixed -top-16 -left-16 w-[320px] sm:w-[440px] h-[320px] sm:h-[440px] pointer-events-none z-0">
        <svg viewBox="0 0 500 500" class="w-full h-full opacity-80" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="c1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.9"/>
                    <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.6"/>
                    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <path fill="url(#c1)" d="M0,0 L360,0 C360,140 300,260 210,320 C120,380 40,390 0,370 Z"/>
        </svg>
    </div>
    <div class="fixed -bottom-16 -right-16 w-[320px] sm:w-[440px] h-[320px] sm:h-[440px] pointer-events-none z-0">
        <svg viewBox="0 0 500 500" class="w-full h-full opacity-80" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="c2" x1="100%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.9"/>
                    <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.6"/>
                    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <path fill="url(#c2)" d="M500,500 L140,500 C140,360 200,240 290,180 C380,120 460,110 500,130 Z"/>
        </svg>
    </div>

    <!-- Header -->
    <header class="relative z-10 w-full pt-3 sm:pt-4 px-4 sm:px-8 flex items-center justify-between shrink-0">
        <a href="{% url 'home' %}" class="inline-flex items-center gap-2 group no-underline">
            <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center text-xs sm:text-sm font-bold shadow-md shadow-blue-500/20 group-hover:scale-105 transition-transform">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <span class="text-base sm:text-lg font-black tracking-tight text-slate-900">
                Edu<span class="text-blue-600">Trust</span>
            </span>
        </a>
    </header>

    <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-1 sm:py-2 min-h-0">
        <div class="w-full max-w-[430px] admin-portal-card rounded-2xl sm:rounded-3xl p-4 sm:p-6 space-y-3">
            <div class="text-center space-y-1.5">
                <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-blue-600/10 border border-blue-200 text-blue-700 text-[9.5px] sm:text-[10px] font-black uppercase tracking-widest">
                    <i class="fas fa-shield-halved text-xs"></i>
                    <span>ADMIN PORTAL</span>
                </div>
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white text-blue-600 border border-blue-200/80 shadow-2xs flex items-center justify-center mx-auto text-sm sm:text-base">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="space-y-0.5">
                    <h1 class="text-lg sm:text-xl font-black text-slate-900 tracking-tight leading-tight">Reset Password</h1>
                    <p class="text-[11px] sm:text-xs text-slate-600 font-medium leading-normal max-w-xs mx-auto">
                        Enter your new password below.
                    </p>
                </div>
            </div>

            <div id="resetAlert" class="hidden p-2 rounded-xl text-xs font-semibold text-center border"></div>

            <form id="resetForm" onsubmit="submitReset(event)" class="space-y-2.5">
                <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                
                <div class="space-y-0.5 text-left">
                    <label class="block text-[9.5px] sm:text-[10px] font-black text-slate-700 uppercase tracking-wider">New Password</label>
                    <div class="relative">
                        <input type="password" id="new_password" required placeholder="Enter new password" class="w-full portal-input text-xs font-medium rounded-xl pl-3 pr-9 py-2">
                        <button type="button" onclick="togglePass('new_password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-xs bg-transparent border-0 cursor-pointer">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="space-y-0.5 text-left">
                    <label class="block text-[9.5px] sm:text-[10px] font-black text-slate-700 uppercase tracking-wider">Confirm New Password</label>
                    <div class="relative">
                        <input type="password" id="confirm_password" required placeholder="Confirm new password" class="w-full portal-input text-xs font-medium rounded-xl pl-3 pr-9 py-2">
                        <button type="button" onclick="togglePass('confirm_password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-xs bg-transparent border-0 cursor-pointer">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-1 text-center">
                    <button type="submit" id="btnReset" class="btn-portal-primary">
                        <span>Update Password</span>
                        <i class="fas fa-save text-xs"></i>
                    </button>
                </div>
            </form>

            <div class="pt-1 text-center">
                <a href="/admin/login/" class="text-xs font-bold text-slate-600 hover:text-blue-600 no-underline inline-flex items-center gap-1.5">
                    <i class="fas fa-arrow-left text-[10px]"></i>
                    <span>Back to Login</span>
                </a>
            </div>
        </div>
    </main>

    <footer class="relative z-10 w-full py-2.5 text-center text-[11px] text-slate-500 font-medium shrink-0">
        <span>© 2026 EduTrust. All rights reserved.</span>
    </footer>

    <script>
    function togglePass(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'far fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'far fa-eye';
        }
    }

    async function submitReset(e) {
        e.preventDefault();
        const alertBox = document.getElementById('resetAlert');
        const btn = document.getElementById('btnReset');
        const new_password = document.getElementById('new_password').value;
        const confirm_password = document.getElementById('confirm_password').value;

        if (new_password !== confirm_password) {
            alertBox.className = 'p-2 rounded-xl text-xs font-semibold text-center border bg-rose-50 border-rose-200 text-rose-700 block mb-2';
            alertBox.textContent = 'New password and confirm password do not match.';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Updating...</span>';

        try {
            const res = await fetch('/api/admin/auth/reset-password/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': (document.querySelector('[name=csrfmiddlewaretoken]') || {}).value || ''
                },
                body: JSON.stringify({ new_password, confirm_password })
            });
            const data = await res.json();
            if (data.status === 'success') {
                window.location.href = data.redirect_url || '/admin/login/';
            } else {
                alertBox.className = 'p-2 rounded-xl text-xs font-semibold text-center border bg-rose-50 border-rose-200 text-rose-700 block mb-2';
                alertBox.textContent = data.message || 'Failed to update password.';
            }
        } catch (err) {
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<span>Update Password</span> <i class="fas fa-save text-xs"></i>';
        }
    }
    </script>
</body>
</html>
