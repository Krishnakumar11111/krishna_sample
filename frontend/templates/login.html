<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduTrust Tuition Platform</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
        <script>
        (function() {
            var origWarn = console.warn;
            console.warn = function() {
                if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('cdn.tailwindcss.com') !== -1) {
                    return;
                }
                origWarn.apply(console, arguments);
            };
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        },
                        accent: {
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    },
                    boxShadow: {
                        'soft': '0 20px 50px -12px rgba(37, 99, 235, 0.12)',
                        'floating': '0 30px 60px -15px rgba(37, 99, 235, 0.25)',
                        'glow': '0 0 35px rgba(59, 130, 246, 0.4)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #070d1e;
            color: #f8fafc;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Glowing Aurora Background Blobs */
        .aurora-blob-1 {
            position: fixed;
            top: -150px;
            left: -100px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.28) 0%, rgba(6, 182, 212, 0.12) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(70px);
            animation: pulseAurora 12s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        .aurora-blob-2 {
            position: fixed;
            bottom: -150px;
            right: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.24) 0%, rgba(37, 99, 235, 0.12) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            animation: pulseAurora 15s infinite alternate-reverse ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulseAurora {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.15) translate(30px, -20px); }
            100% { transform: scale(0.95) translate(-20px, 30px); }
        }

        .glass-card {
            background: rgba(10, 16, 31, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .animated-card-border {
            position: relative;
            border-radius: 1.5rem;
        }

        .animated-card-border::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 1.6rem;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.45), rgba(147, 51, 234, 0.25), rgba(6, 182, 212, 0.35));
            z-index: -1;
            filter: blur(10px);
            opacity: 0.55;
            transition: opacity 0.4s ease;
        }

        .animated-card-border:hover::before {
            opacity: 0.85;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 sm:p-6 relative">

    <!-- Background Aurora Effect -->
    <div class="aurora-blob-1"></div>
    <div class="aurora-blob-2"></div>

    <!-- Login Container Box -->
    <div class="w-full max-w-md animated-card-border z-10">
        <div class="w-full glass-card rounded-3xl p-8 sm:p-10 shadow-floating text-white space-y-6 relative overflow-hidden">
            
            <!-- Header & Brand Logo -->
            <div class="text-center">
                <a href="{% url 'home' %}" class="inline-flex items-center justify-center gap-3 mb-6 group text-decoration-none">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 via-indigo-600 to-cyan-400 flex items-center justify-center text-white font-bold text-2xl shadow-lg shadow-brand-500/40 group-hover:scale-110 transition-all duration-300">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <span class="text-3xl font-extrabold tracking-tight text-white">
                        Edu<span class="text-brand-500">Trust</span>
                    </span>
                </a>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Welcome Back</h2>
                <p class="text-slate-400 text-xs sm:text-sm mt-1.5 font-medium">Login to continue your learning journey</p>
            </div>

            <!-- Error Box -->
            <div id="errorBox" class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 p-3.5 rounded-2xl hidden text-xs font-semibold text-center flex items-center justify-center gap-2">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Incorrect email or password.</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-5">
                {% csrf_token %}
                
                <!-- Email Field -->
                <div>
                    <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-300 mb-2">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 text-sm">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <input type="email" id="email" placeholder="student@example.com" class="w-full bg-slate-950/85 border border-slate-700/80 text-white placeholder-slate-500 pl-11 pr-4 py-3.5 rounded-2xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-inner" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-300">Password</label>
                        <a href="{% url 'forget_password' %}" class="text-xs text-brand-400 hover:text-brand-300 font-bold transition-colors text-decoration-none">
                            Forgot Password?
                        </a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 text-sm">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key===' '||event.keyCode===32)event.preventDefault();" class="w-full bg-slate-950/85 border border-slate-700/80 text-white placeholder-slate-500 pl-11 pr-11 py-3.5 rounded-2xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-inner" required>
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-white transition-colors border-0 bg-transparent cursor-pointer">
                            <i id="passwordEyeIcon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-brand-600 via-indigo-600 to-cyan-500 hover:from-brand-700 hover:to-indigo-700 text-white font-extrabold py-3.5 rounded-2xl text-sm transition-all duration-300 shadow-lg shadow-brand-500/30 hover:shadow-brand-500/50 hover:scale-[1.02] border-0 cursor-pointer flex items-center justify-center gap-2">
                    <span>Log In</span>
                    <i class="fas fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Register Link Footer -->
            <div class="pt-4 border-t border-slate-800 text-center">
                <p class="text-xs text-slate-400 mb-0 font-medium">
                    Don't have an account?
                    <a href="{% url 'student_registration' %}" class="text-brand-400 font-extrabold hover:text-brand-300 hover:underline transition-colors text-decoration-none ml-1">
                        Register here
                    </a>
                </p>
            </div>
        </div>
    </div>

    <!-- Success Modal Popup -->
    <div id="successModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 hidden opacity-0 transition-all duration-300 p-4">
        <div class="bg-slate-900 border border-slate-700/80 p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center transform scale-95 transition-all duration-300" id="modalContent">
            <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 border border-emerald-500/40 shadow-lg shadow-emerald-500/20">
                <i class="fas fa-check"></i>
            </div>
            <h3 class="text-2xl font-extrabold text-white mb-2">Congratulations!</h3>
            <p class="text-slate-300 text-xs sm:text-sm mb-6 leading-relaxed" id="successText">Your form has been submitted successfully.</p>
            <button onclick="closeSuccessPopup()" class="w-full py-3.5 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white font-extrabold rounded-2xl border-0 cursor-pointer shadow-lg shadow-brand-500/30 transition-all">
                OK
            </button>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('passwordEyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const errorBox = document.getElementById('errorBox');
                const errorText = document.getElementById('errorText');
                const loginBtn = document.getElementById('loginBtn');

                if (password.includes(' ')) {
                    if (errorText) errorText.textContent = 'Password cannot contain spaces.';
                    if (errorBox) errorBox.classList.remove('hidden');
                    return;
                }

                if (errorBox) errorBox.classList.add('hidden');
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Authenticating...';

                fetch('/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ email: email, password: password })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'otp_required') {
                        // OTP Required -> redirect to main page to enter OTP in auth modal
                        window.location.href = '/?open_auth=login-otp';
                    } else if (data.status === 'success') {
                        const modal = document.getElementById('successModal');
                        const successText = document.getElementById('successText');
                        if (successText) successText.textContent = data.message;
                        if (modal) {
                            modal.classList.remove('hidden');
                            setTimeout(() => modal.classList.remove('opacity-0'), 10);
                        }
                        setTimeout(() => {
                            window.location.href = data.redirect_url || '/';
                        }, 1000);
                    } else {
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<span>Log In</span><i class="fas fa-arrow-right text-xs"></i>';
                        if (errorText) errorText.textContent = data.message || 'Login failed. Please check credentials.';
                        if (errorBox) errorBox.classList.remove('hidden');
                    }
                })
                .catch(err => {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>Log In</span><i class="fas fa-arrow-right text-xs"></i>';
                    if (errorText) errorText.textContent = 'Authentication error. Please check credentials.';
                    if (errorBox) errorBox.classList.remove('hidden');
                });
            });
        }

        function closeSuccessPopup() {
            const modal = document.getElementById('successModal');
            if (modal) {
                modal.classList.add('opacity-0');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }
    </script>
    <script src="edu.js"></script>
    <script src="study.js"></script>
</body>

</html>
