<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | EduTrust Tuition Platform</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        },
                        accent: {
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    },
                    boxShadow: {
                        'soft': '0 20px 50px -12px rgba(37, 99, 235, 0.12)',
                        'floating': '0 30px 60px -15px rgba(37, 99, 235, 0.25)',
                        'glow': '0 0 35px rgba(59, 130, 246, 0.4)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1329;
            color: #f8fafc;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Glowing Aurora Background Blobs */
        .aurora-blob-1 {
            position: fixed;
            top: -150px;
            left: -100px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.35) 0%, rgba(6, 182, 212, 0.15) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(70px);
            animation: pulseAurora 12s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        .aurora-blob-2 {
            position: fixed;
            bottom: -150px;
            right: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.3) 0%, rgba(37, 99, 235, 0.15) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            animation: pulseAurora 15s infinite alternate-reverse ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulseAurora {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.15) translate(30px, -20px); }
            100% { transform: scale(0.95) translate(-20px, 30px); }
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .animated-card-border {
            position: relative;
            border-radius: 1.5rem;
        }

        .animated-card-border::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 1.6rem;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.5), rgba(147, 51, 234, 0.3), rgba(6, 182, 212, 0.4));
            z-index: -1;
            filter: blur(10px);
            opacity: 0.7;
            transition: opacity 0.4s ease;
        }

        .animated-card-border:hover::before {
            opacity: 1;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 sm:p-6 relative">

    <!-- Background Aurora Effect -->
    <div class="aurora-blob-1"></div>
    <div class="aurora-blob-2"></div>

    <!-- Forgot Password Container Box -->
    <div class="w-full max-w-md animated-card-border z-10">
        <div class="w-full glass-card rounded-3xl p-8 sm:p-10 shadow-floating text-white space-y-6 relative overflow-hidden">
            
            <!-- Header & Brand Logo -->
            <div class="text-center">
                <a href="{% url 'home' %}" class="inline-flex items-center justify-center gap-3 mb-6 group text-decoration-none">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 via-indigo-600 to-cyan-400 flex items-center justify-center text-white font-bold text-2xl shadow-lg shadow-brand-500/40 group-hover:scale-110 transition-all duration-300">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <span class="text-3xl font-extrabold tracking-tight text-white">
                        Edu<span class="text-brand-500">Trust</span>
                    </span>
                </a>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Reset Password</h2>
                <p class="text-slate-400 text-xs sm:text-sm mt-1.5 font-medium">Enter your email to reset password and proceed to registration</p>
            </div>

            <!-- Alert Box -->
            <div id="alertBox" class="p-3.5 rounded-2xl hidden text-xs font-semibold text-center flex items-center justify-center gap-2"></div>

            <!-- Forgot Password Form -->
            <form id="forgotForm" class="space-y-5">
                {% csrf_token %}
                
                <!-- Email Field -->
                <div>
                    <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-300 mb-2">Registered Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 text-sm">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <input type="email" id="email" placeholder="your.email@example.com" class="w-full bg-slate-900/80 border border-slate-700/80 text-white placeholder-slate-500 pl-11 pr-4 py-3.5 rounded-2xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-inner" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-brand-600 via-indigo-600 to-cyan-500 hover:from-brand-700 hover:to-indigo-700 text-white font-extrabold py-3.5 rounded-2xl text-sm transition-all duration-300 shadow-lg shadow-brand-500/30 hover:shadow-brand-500/50 hover:scale-[1.02] border-0 cursor-pointer flex items-center justify-center gap-2">
                    <span>Submit & Register New</span>
                    <i class="fas fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Back to Login Link Footer -->
            <div class="pt-4 border-t border-slate-800 text-center">
                <p class="text-xs text-slate-400 mb-0 font-medium">
                    Remember your password?
                    <a href="{% url 'login' %}" class="text-brand-400 font-extrabold hover:text-brand-300 hover:underline transition-colors text-decoration-none ml-1">
                        Login here
                    </a>
                </p>
            </div>
        </div>
    </div>

    <!-- Success Modal Popup -->
    <div id="successModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 hidden opacity-0 transition-all duration-300 p-4">
        <div class="bg-slate-900 border border-slate-700/80 p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center transform scale-95 transition-all duration-300" id="modalContent">
            <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 border border-emerald-500/40 shadow-lg shadow-emerald-500/20">
                <i class="fas fa-check"></i>
            </div>
            <h3 class="text-2xl font-extrabold text-white mb-2">Congratulations!</h3>
            <p class="text-slate-300 text-xs sm:text-sm mb-6 leading-relaxed" id="successText">Your form has been submitted successfully.</p>
            <button onclick="closeSuccessPopup()" class="w-full py-3.5 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white font-extrabold rounded-2xl border-0 cursor-pointer shadow-lg shadow-brand-500/30 transition-all">
                OK
            </button>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const alertBox = document.getElementById('alertBox');

            if(!email) {
                alertBox.className = "p-3.5 rounded-2xl mb-4 text-xs font-semibold text-center flex items-center justify-center gap-2 bg-rose-500/10 border border-rose-500/30 text-rose-400";
                alertBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please enter a valid email address.';
                alertBox.classList.remove('hidden');
                return;
            }

            // Success feedback
            alertBox.className = "p-3.5 rounded-2xl mb-4 text-xs font-semibold text-center flex items-center justify-center gap-2 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400";
            alertBox.innerHTML = '<i class="fas fa-check-circle"></i> Success! Redirecting to Registration page...';
            alertBox.classList.remove('hidden');

            // Redirecting to registration page after submit
            setTimeout(() => {
                window.location.href = '{% url 'student_registration' %}';
            }, 1200);
        });

        function closeSuccessPopup() {
            const modal = document.getElementById('successModal');
            if (modal) {
                modal.classList.add('opacity-0');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }
    </script>
</body>

</html>
