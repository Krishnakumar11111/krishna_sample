<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Login | EduTrust LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans relative overflow-hidden">
    <!-- Ambient Glow Background -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 backdrop-blur-xl rounded-3xl p-8 shadow-2xl space-y-6 relative z-10">
        
        <!-- EduTrust LMS Brand Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 text-white text-2xl font-black shadow-lg shadow-blue-500/30 mb-2">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white flex items-center justify-center gap-1.5">
                Edu<span class="text-blue-500">Trust</span> <span class="text-xs px-2.5 py-0.5 rounded-full bg-blue-500/10 border border-blue-500/30 text-blue-400 font-extrabold uppercase tracking-widest ml-1">Super Admin</span>
            </h1>
            <p class="text-xs font-semibold text-slate-400">Welcome Back • Secure Access Portal</p>
        </div>

        {% if expired == '1' %}
        <div class="p-3 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-semibold rounded-2xl text-center">
            <i class="fas fa-clock mr-1"></i> Session expired due to 30 minutes of inactivity. Please log in again.
        </div>
        {% endif %}

        <!-- Alert Toast -->
        <div id="loginAlert" class="hidden p-3.5 rounded-2xl text-xs font-semibold text-center border"></div>

        <!-- Login Form -->
        <form id="adminLoginForm" onsubmit="submitAdminLogin(event)" class="space-y-4">
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            <input type="hidden" id="nextUrl" value="{{ next_url|default:'/admin/dashboard/' }}">

            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Username or Email Address</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"><i class="fas fa-user"></i></span>
                    <input type="text" id="username_or_email" required placeholder="admin or admin@edutrust.com" class="w-full bg-slate-800/80 border border-slate-700/80 text-white text-xs font-semibold rounded-2xl pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest">Password</label>
                    <a href="/admin/forgot-password/" class="text-[11px] font-extrabold text-blue-400 hover:text-blue-300 no-underline">Forgot Password?</a>
                </div>
                <div class="relative">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"><i class="fas fa-lock"></i></span>
                    <input type="password" id="admin_password" required placeholder="••••••••" class="w-full bg-slate-800/80 border border-slate-700/80 text-white text-xs font-semibold rounded-2xl pl-10 pr-10 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all">
                    <button type="button" onclick="togglePass('admin_password', this)" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs bg-transparent border-0 cursor-pointer">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between pt-1">
                <label class="flex items-center gap-2 text-xs font-semibold text-slate-400 cursor-pointer select-none">
                    <input type="checkbox" id="remember_me" class="w-4 h-4 rounded border-slate-700 bg-slate-800 text-blue-600 focus:ring-blue-500/30">
                    <span>Remember me</span>
                </label>
            </div>

            <button type="submit" id="btnAdminLogin" class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold text-xs rounded-2xl shadow-lg shadow-blue-600/30 cursor-pointer border-0 transition-all flex items-center justify-center gap-2">
                <span>LOGIN TO SUPER ADMIN</span>
                <i class="fas fa-arrow-right text-[10px]"></i>
            </button>
        </form>

        <div class="pt-4 border-t border-slate-800 text-center">
            <p class="text-[10px] font-semibold text-slate-500">
                <i class="fas fa-shield-alt text-emerald-500 mr-1"></i> End-to-End Encrypted & Role-Verified Super Admin Portal
            </p>
        </div>
    </div>

    <script>
    function togglePass(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'far fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'far fa-eye';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem('saved_admin_user');
        if (savedUser) {
            document.getElementById('username_or_email').value = savedUser;
            document.getElementById('remember_me').checked = true;
        }
    });

    async function submitAdminLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('btnAdminLogin');
        const alertBox = document.getElementById('loginAlert');
        const username_or_email = document.getElementById('username_or_email').value;
        const password = document.getElementById('admin_password').value;
        const remember_me = document.getElementById('remember_me').checked;
        const nextUrl = document.getElementById('nextUrl').value;



        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
        alertBox.className = 'hidden';

        try {
            const res = await fetch('/api/admin/auth/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': (document.querySelector('[name=csrfmiddlewaretoken]') || {}).value || ''
                },
                body: JSON.stringify({ username_or_email, password, remember_me, next: nextUrl })
            });
            const data = await res.json();
            if (data.status === 'success') {
                if (remember_me) {
                    localStorage.setItem('saved_admin_user', username_or_email);
                } else {
                    localStorage.removeItem('saved_admin_user');
                }
                alertBox.className = 'p-3.5 rounded-2xl text-xs font-semibold text-center border bg-emerald-500/10 border-emerald-500/30 text-emerald-400 block';
                alertBox.textContent = data.message;
                setTimeout(() => { window.location.href = data.redirect_url; }, 1000);
            } else {
                
                alertBox.className = 'p-3.5 rounded-2xl text-xs font-semibold text-center border bg-rose-500/10 border-rose-500/30 text-rose-400 block';
                alertBox.textContent = data.message || 'Login failed.';
                btn.disabled = false;
                btn.innerHTML = '<span>LOGIN TO SUPER ADMIN</span> <i class="fas fa-arrow-right text-[10px]"></i>';
            }
        } catch (err) {
            console.error(err);
            alertBox.className = 'p-3.5 rounded-2xl text-xs font-semibold text-center border bg-rose-500/10 border-rose-500/30 text-rose-400 block';
            alertBox.textContent = 'Server connection error. Please try again.';
            btn.disabled = false;
            btn.innerHTML = '<span>LOGIN TO SUPER ADMIN</span> <i class="fas fa-arrow-right text-[10px]"></i>';
        }
    }
    </script>
</body>
</html>
