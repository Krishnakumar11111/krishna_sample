<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | EduTrust LMS Super Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 500: '#3b82f6', 600: '#2563eb' } } } } }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans relative overflow-hidden">
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 backdrop-blur-xl rounded-3xl p-8 shadow-2xl space-y-6 relative z-10">
        
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white text-2xl font-black shadow-lg shadow-blue-500/30 mb-1">
                <i class="fas fa-lock"></i>
            </div>
            <h2 class="text-xl font-black text-white tracking-tight">Set New Super Admin Password</h2>
            <p class="text-xs font-semibold text-slate-400">Must contain min 8 chars, uppercase, lowercase, digit, and special char.</p>
        </div>

        <div id="resetAlert" class="hidden p-3.5 rounded-2xl text-xs font-semibold text-center border"></div>

        <form id="resetForm" onsubmit="submitReset(event)" class="space-y-4">
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">New Password</label>
                <div class="relative">
                    <input type="password" id="new_password" required minlength="8" placeholder="••••••••" class="w-full bg-slate-800/80 border border-slate-700/80 text-white text-xs font-semibold rounded-2xl pl-4 pr-10 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                    <button type="button" onclick="togglePass('new_password', this)" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs border-0 bg-transparent cursor-pointer">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Confirm New Password</label>
                <div class="relative">
                    <input type="password" id="confirm_password" required minlength="8" placeholder="••••••••" class="w-full bg-slate-800/80 border border-slate-700/80 text-white text-xs font-semibold rounded-2xl pl-4 pr-10 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                    <button type="button" onclick="togglePass('confirm_password', this)" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs border-0 bg-transparent cursor-pointer">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btnReset" class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold text-xs rounded-2xl shadow-lg shadow-blue-600/30 cursor-pointer border-0 transition-all">
                UPDATE PASSWORD & LOGIN
            </button>
        </form>
    </div>

    <script>
    function togglePass(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'far fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'far fa-eye';
        }
    }

    async function submitReset(e) {
        e.preventDefault();
        const alertBox = document.getElementById('resetAlert');
        const btn = document.getElementById('btnReset');
        const new_password = document.getElementById('new_password').value;
        const confirm_password = document.getElementById('confirm_password').value;

        if (new_password !== confirm_password) {
            alertBox.className = 'p-3.5 rounded-2xl text-xs font-semibold text-center border bg-rose-500/10 border-rose-500/30 text-rose-400 block';
            alertBox.textContent = 'New password and confirm password do not match.';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

        try {
            const res = await fetch('/api/admin/auth/reset-password/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': (document.querySelector('[name=csrfmiddlewaretoken]') || {}).value || ''
                },
                body: JSON.stringify({ new_password, confirm_password })
            });
            const data = await res.json();
            if (data.status === 'success') {
                alertBox.className = 'p-3.5 rounded-2xl text-xs font-semibold text-center border bg-emerald-500/10 border-emerald-500/30 text-emerald-400 block';
                alertBox.textContent = data.message;
                setTimeout(() => { window.location.href = data.redirect_url; }, 1200);
            } else {
                alertBox.className = 'p-3.5 rounded-2xl text-xs font-semibold text-center border bg-rose-500/10 border-rose-500/30 text-rose-400 block';
                alertBox.textContent = data.message || 'Failed to update password.';
                btn.disabled = false;
                btn.textContent = 'UPDATE PASSWORD & LOGIN';
            }
        } catch (err) {
            console.error(err);
            btn.disabled = false;
            btn.textContent = 'UPDATE PASSWORD & LOGIN';
        }
    }
    </script>
</body>
</html>
